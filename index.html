<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Click the Circle Game - dev</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background-color: #f0f0f0;
      margin: 0;
      padding: 20px;
    }

    h1 {
      margin-top: 30px;
    }

    #gameArea {
      width: 600px;
      height: 400px;
      margin: 30px auto;
      position: relative;
      background-color: white;
      border: 2px solid #ccc;
      border-radius: 10px;
    }

    #circle {
      width: 50px;
      height: 50px;
      background-color: #4CAF50;
      border-radius: 50%;
      position: absolute;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #score {
      font-size: 24px;
      margin-top: 20px;
    }

    button {
      padding: 10px 20px;
      margin-top: 15px;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>🎯 Click the Circle!</h1>
  <div id="score">Score: 0</div>
  <button onclick="resetGame()">Reset Game</button>
  <div id="gameArea">
    <div id="circle" onclick="moveCircle()"></div>
  </div>

  <script>
    let score = 0;
    const gameArea = document.getElementById("gameArea");
    const circle = document.getElementById("circle");
    const scoreDisplay = document.getElementById("score");

    function moveCircle() {
      score++;
      scoreDisplay.textContent = "Score: " + score;

      const maxX = gameArea.clientWidth - circle.offsetWidth;
      const maxY = gameArea.clientHeight - circle.offsetHeight;

      const newX = Math.floor(Math.random() * maxX);
      const newY = Math.floor(Math.random() * maxY);

      circle.style.left = newX + "px";
      circle.style.top = newY + "px";
    }

    function resetGame() {
      score = 0;
      scoreDisplay.textContent = "Score: " + score;
      moveCircle();
    }

    // Start game by placing circle randomly
    window.onload = moveCircle;
  </script>
</body>
</html>
